# 청첩장 자동 배포
# main 브랜치에 변경사항이 저장(commit)될 때마다 자동으로 실행됩니다.
# config.js 에 오타가 있으면 배포를 멈추고(기존 청첩장은 그대로 유지) 빨간 X 로 알려줍니다.
name: 청첩장 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 검사 및 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: 회귀 테스트
        run: npm test
      - name: AI 안내문 동기화
        run: node scripts/ai-pack.mjs --check

      - name: GitHub Pages 설정 확인
        id: pages
        uses: actions/configure-pages@v6

      - name: config.js 검사 및 빌드
        run: |
          if [ "$GITHUB_REPOSITORY" = "HyunIm/wedding-invitation" ]; then
            node scripts/build.mjs --demo
          else
            node scripts/build.mjs
          fi
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 사진 용량 줄이기 (원본은 저장소에 그대로)
        run: |
          pip install --quiet -r scripts/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/optimize_images.py _site

      - name: 처음 실행 안내
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages 가 아직 켜져 있지 않아요. Settings → Pages → Source 를 'GitHub Actions' 로 바꾼 뒤, Actions 탭에서 '청첩장 배포' → Run workflow 를 눌러주세요."

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
