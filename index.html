<!doctype html>
<!--
  ⚠️ 이 파일은 고치지 않아도 됩니다. 청첩장 내용은 config.js 에서 바꿔주세요.
     (아래 미리보기 정보도 배포할 때 config.js 내용으로 자동으로 바뀝니다.)
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#f7f3ee" />

  <!-- META:START (배포 시 config.js 의 meta 값으로 자동 교체) -->
  <title>모바일 청첩장</title>
  <meta name="description" content="저희 결혼식에 초대합니다." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="모바일 청첩장" />
  <meta property="og:description" content="저희 결혼식에 초대합니다." />
  <meta property="og:image" content="images/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- META:END -->

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Gaegu:wght@400;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- 배경 (데스크톱에서 양옆에 보이는 흐린 사진) -->
  <div class="backdrop" aria-hidden="true"></div>

  <!-- 청첩장 본문은 assets/app.js 가 config.js 내용을 읽어 여기에 그립니다 -->
  <main id="app" class="invitation" aria-live="polite">
    <div class="loading">
      <div class="loading__heart">♥</div>
    </div>
  </main>

  <noscript>
    <p style="padding:40px 20px;text-align:center">청첩장을 보려면 자바스크립트를 켜주세요.</p>
  </noscript>

  <script>
    // config.js 에 오타가 있을 때 몇 번째 줄인지 알려주기 위한 코드
    window.addEventListener('error', function (e) {
      if (e.filename && /config\.js/.test(e.filename)) window.__CONFIG_ERROR__ = { line: e.lineno, message: e.message };
    });
  </script>
  <script src="config.js"></script>
  <script src="assets/config-utils.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
